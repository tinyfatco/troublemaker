version: 3
expires_after: 24h
idle_timeout: 2h

allow:
  tools:
    - start_session
    - end_session
    - get_session
    - list_sessions
    - get_session_state
    - list_apps
    - list_windows
    - get_window_state
    - verify_state
    - launch_app
    - kill_app
    - bring_to_front
    - set_window_frame
    - invoke_menu
    - click
    - double_click
    - right_click
    - drag
    - type_text
    - press_key
    - hotkey
    - set_value
    - scroll
    - clipboard_read
    - clipboard_write
    - get_screen_size
    - get_desktop_state
    - get_cursor_position
    - move_cursor
    - set_agent_cursor_enabled
    - set_agent_cursor_motion
    - set_agent_cursor_theme
    - get_agent_cursor_state
    - check_permissions
    - health_report
    - get_config
    - get_accessibility_tree

resources:
  apps:
    - executable: /usr/bin/chromium
      launch: true
      windows: all
      terminate: driver_launched
  files:
    read:
      - dir: /data
        recursive: true
    write:
      - dir: /data
        recursive: true
  desktop:
    display: true
