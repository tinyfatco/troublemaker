[project]
name = "troublemaker-tui"
version = "0.1.0"
description = "Textual terminal client for a Troublemaker agent's canonical console session"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "textual>=6.0",
    "httpx>=0.27",
]

[project.scripts]
troublemaker-textual = "troublemaker_tui.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/troublemaker_tui"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
