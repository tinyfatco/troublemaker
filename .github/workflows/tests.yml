name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      # Excluded on Linux CI:
      # - macos-resident-updater needs macOS tools (PlistBuddy).
      # - tui-pty drives a real terminal through `expect` and fails headless.
      - run: pnpm test --exclude test/macos-resident-updater --exclude test/tui-pty
